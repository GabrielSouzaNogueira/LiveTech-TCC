<div class="cadastro-usuario-container">
    <div class="card-minimalista">
        
        <!-- BOTOES DE NAVEGACAO (ABAS) -->
        <div class="navegacao-abas">
            <button 
                type="button" 
                class="btn-aba" 
                [class.aba-ativa]="abaAtiva === 'cadastrar'" 
                (click)="alternarAba('cadastrar')">
                Novo Usuário
            </button>

            <button 
                type="button" 
                class="btn-aba" 
                [class.aba-ativa]="abaAtiva === 'atualizar'" 
                (click)="alternarAba('atualizar')">
                Gestão de Usuários
            </button>
        </div>

        <!-- ABA DE CADASTRO -->
        @if (abaAtiva === 'cadastrar') {
            <div class="cabecalho-form">
                <h2>Cadastro de Usuário</h2>
                <p>Preencha os dados abaixo para conceder acesso ao sistema.</p>
            </div>

            <form class="formulario-grid" #form="ngForm" (ngSubmit)="executarCadastroUsuario()">
                
                <div class="form-group span-2">
                    <label for="username">Nome Completo:</label>
                    <input 
                        type="text"
                        id="username"
                        name="username"
                        [(ngModel)]="nomeDigitado"
                        placeholder="Ex: João da Silva"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input 
                        type="email"
                        id="email"
                        name="email"
                        [(ngModel)]="emailDigitado"
                        placeholder="joao@empresa.com">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input 
                        type="text" 
                        id="telefone"
                        name="telefone"
                        [(ngModel)]="telefoneDigitado"
                        placeholder="(00) 00000-0000"
                        mask="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="cargo">Cargo/Perfil de Acesso:</label>
                    <select 
                        name="cargo" 
                        id="cargo"
                        [(ngModel)]="cargoDigitado"
                        required>
                        <option value="" disabled>Selecione um cargo</option>
                        <option value="BALCONISTA">Balconista</option>
                        <option value="ADMINISTRADOR">Administrador</option>
                        <option value="GERENTE">Gerente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="password">Senha Provisória:</label>
                    <input 
                        type="password"
                        id="password"
                        name="password"
                        [(ngModel)]="senhaDigitada"
                        placeholder="Crie uma senha de acesso"
                        required>
                </div>

                <div class="acoes-form span-2">
                    <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando">
                        {{carregando ? 'Salvando...' : 'Cadastrar Usuário'}}
                    </button>
                </div>
            </form>
        }
        
        <!-- ABA DE GESTÃO -->
        @if (abaAtiva === 'atualizar') {
            <app-gerenciador-usuario></app-gerenciador-usuario>
        }
    </div>
</div>
