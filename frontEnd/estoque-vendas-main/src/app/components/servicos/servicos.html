<div class="cadastro-servico-container">
    <div class="card-minimalista">

        <!-- BOTOES DE NAVEGACAO (ABAS) -->
        <div class="navegacao-abas">
            <button
                type="button"
                class="btn-aba"
                [class.aba-ativa]="abaAtiva === 'cadastrar'"
                (click)="alternarAba('cadastrar')">
                Novo Serviço
            </button>
            <button
                type="button"
                class="btn-aba"
                [class.aba-ativa]="abaAtiva === 'atualizar'"
                (click)="alternarAba('atualizar')">
                Gestão de Serviços
            </button>
        </div>

        <!-- ABA DE CADASTRO -->
        @if (abaAtiva === 'cadastrar') {
            <div class="cabecalho-form">
                <h2>Cadastro de Serviço</h2>
                <p>Preencha os dados abaixo para adicionar um serviço ao catálogo.</p>
            </div>

            <form class="formulario-grid" #form="ngForm" (ngSubmit)="executarCadastroServicos()">

                <div class="form-group span-2">
                    <label for="descServico">Descrição do Serviço:</label>
                    <input
                        type="text"
                        id="descServico"
                        name="descServico"
                        [(ngModel)]="descServicoDigitado"
                        placeholder="Ex: Formatação de Computador"
                        required>
                </div>

                <div class="form-group span-2">
                    <label for="precoServico">Preço Base (R$):</label>
                    <input
                        type="number"
                        id="precoServico"
                        name="precoServico"
                        [(ngModel)]="precoServicoDigitado"
                        placeholder="0.00"
                        step="0.01"
                        min="0"
                        required>
                </div>

                <div class="acoes-form span-2">
                    <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando">
                        {{ carregando ? 'Cadastrando...' : 'Cadastrar Serviço' }}
                    </button>
                </div>
            </form>
        }

        <!-- ABA DE GESTÃO -->
        @if (abaAtiva === 'atualizar') {
            <app-gerenciador-servicos></app-gerenciador-servicos>
        }
    </div>
</div>
