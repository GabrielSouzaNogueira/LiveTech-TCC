<div class="cadastro-produto-container">
    <div class="card-minimalista">
        
        <!-- BOTOES DE NAVEGACAO (ABAS) -->
        <div class="navegacao-abas">
            <button 
                type="button" 
                class="btn-aba" 
                [class.aba-ativa]="abaAtiva === 'cadastrar'" 
                (click)="alternarAba('cadastrar')">
                Novo Produto
            </button>

            <button 
                type="button" 
                class="btn-aba" 
                [class.aba-ativa]="abaAtiva === 'atualizar'" 
                (click)="alternarAba('atualizar')">
                Gestão de Produtos
            </button>
        </div>

        <!-- ABA DE CADASTRO -->
        @if (abaAtiva === 'cadastrar') {
            <div class="cabecalho-form">
                <h2>Cadastro de Produto</h2>
                <p>Preencha os dados abaixo para adicionar um item ao catálogo.</p>
            </div>

            <form class="formulario-grid" #form="ngForm" (ngSubmit)="executarCadastroProduto()">
                
                <div class="form-group span-2">
                    <label for="username">Descrição do Produto:</label>
                    <input 
                        type="text"
                        id="username"
                        name="username"
                        [(ngModel)]="nomeDigitado"
                        placeholder="Ex: Capinha Silicone Transparente"
                        required>
                </div>

                <div class="form-group">
                    <label for="marca">Marca:</label>
                    <input 
                        type="text"
                        id="marca"
                        name="marca"
                        [(ngModel)]="marcaDigitada"
                        placeholder="Fabricante"
                        required>
                </div>

                <div class="form-group">
                    <label for="codBarra">Código de Barras:</label>
                    <input 
                        type="text"
                        id="codBarra"
                        name="codBarra"
                        [(ngModel)]="codBarraDigitada"
                        placeholder="Apenas números"
                        maxlength="13"
                        (input)="codBarraDigitada = codBarraDigitada.replace(/\D/g, '')">
                </div>

                <div class="form-group">
                    <label for="quantidade">Qtd. Inicial (Estoque):</label>
                    <input 
                        type="number"
                        id="quantidade"
                        name="quantidade"
                        [(ngModel)]="quantidadeDigitada"
                        placeholder="0"
                        step="1"
                        min="0"
                        required>
                </div>

                <div class="form-group"></div> <!-- Espaçador para empurrar os preços para a próxima linha se quiser -->

                <div class="form-group">
                    <label for="precoCusto">Preço de Custo (R$):</label>
                    <input 
                        type="number"
                        id="precoCusto"
                        name="precoCusto"
                        [(ngModel)]="precoCustoDigitado"
                        placeholder="0.00"
                        step="0.01"
                        min="0"
                        required>
                </div>

                <div class="form-group">
                    <label for="precoVenda">Preço de Venda (R$):</label>
                    <input 
                        type="number"
                        id="precoVenda"
                        name="precoVenda"
                        [(ngModel)]="precoVendaDigitado"
                        placeholder="0.00"
                        step="0.01"
                        min="0"
                        required>
                </div>

                <div class="acoes-form span-2">
                    <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando">
                        {{carregando ? 'Salvando...' : 'Cadastrar Produto'}}
                    </button>
                </div>
            </form>
        }
        
        <!-- ABA DE GESTÃO/ATUALIZAÇÃO -->
        @if (abaAtiva === 'atualizar') {
            <app-gerenciador-produto></app-gerenciador-produto>
        }
    </div>
</div>
