<div class="gestao-container">
  
  <div class="barra-filtros">
    <div class="filtro-busca">
      <input type="text" placeholder="Buscar por Descrição..." [(ngModel)]="termoBusca" (keyup)="aplicarFiltros()">
    </div>
    <div class="filtro-status">
      <select [(ngModel)]="filtroStatus" (change)="aplicarFiltros()">
        <option value="TODOS">Todos os Status</option>
        <option value="ATIVO">Ativos</option>
        <option value="INATIVO">Inativos</option>
      </select>
    </div>
  </div>

  <div class="tabela-wrapper">
    <table>
      <thead>
        <tr>
          <th>Descrição do Serviço</th>
          <th class="texto-direita">Preço Base</th>
          <th class="texto-centro">Status</th>
          <th class="texto-centro">Ação</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let servico of listaServicosFiltrada">
          <td class="fw-bold">{{ servico.descServico }}</td>
          <td class="texto-direita">{{ servico.precoServico | currency:'BRL' }}</td>
          <td class="texto-centro">
            <span class="badge" [ngClass]="servico.status === 'ATIVO' ? 'badge-ativa' : 'badge-inativa'">
              {{ servico.status }}
            </span>
          </td>
          <td class="celula-acao">
            <button class="btn-visualizar" (click)="abrirModalEdicao(servico)">Editar</button>
            <button *ngIf="servico.status === 'ATIVO'" class="btn-acao-rapida btn-perigo" [disabled]="isInativando(servico)" (click)="inativarServicos(servico, $event)" title="Inativar Serviço">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>
              </svg>
            </button>
          </td>
        </tr>
        <tr *ngIf="listaServicosFiltrada.length === 0 && !carregando">
          <td colspan="4" class="sem-dados">Nenhum serviço encontrado.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- MODAL FLUTUANTE -->
<div class="overlay-modal" *ngIf="modalAberto && servicoEmEdicao" (click)="fecharModal()">
  <div class="modal-conteudo" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Editar Serviço</h3>
      <button class="btn-fechar-modal" (click)="fecharModal()">✕</button>
    </div>

    <div class="modal-body">
      <form class="formulario-grid" #editForm="ngForm">
        <div class="form-group span-2">
          <label>Descrição do Serviço:</label>
          <input type="text" name="descEdit" [(ngModel)]="servicoEmEdicao.descServico" required>
        </div>
        <div class="form-group span-2">
          <label>Preço Base (R$):</label>
          <input type="number" name="precoEdit" [(ngModel)]="servicoEmEdicao.precoServico" step="0.01" required>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-secundario" (click)="fecharModal()">Cancelar</button>
      <button type="button" class="btn-primario" [disabled]="editForm.invalid || salvando" (click)="executarGerenciadorServicos()">
        {{ salvando ? 'Salvando...' : 'Salvar Alterações' }}
      </button>
    </div>
  </div>
</div>
