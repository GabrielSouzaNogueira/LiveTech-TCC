<div class="login-container">
    <div class="card-login">
        
        <div class="login-header">
            <div class="logo-placeholder">📦</div>
            <h2>Estoque & Vendas</h2>
            <p>Insira suas credenciais para acessar o sistema.</p>
        </div>

        <!-- (ngSubmit) faz o Enter dentro de qualquer input do form chamar executarLogin() -->
        <form (ngSubmit)="executarLogin()">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input 
                    type="text"
                    id="username"
                    name="username"
                    [(ngModel)]="usuarioDigitado"
                    placeholder="Digite seu usuário"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input 
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="senhaDigitada"
                    placeholder="Digite sua senha"
                    required>
            </div>
            
            <!-- type="submit" faz o Enter e o clique chamarem o mesmo (ngSubmit) do form -->
            <button type="submit" class="btn-primario" [disabled]="carregando">
                {{ carregando ? 'Entrando...' : 'Entrar' }}
            </button>
        </form> 
    </div>
</div>
