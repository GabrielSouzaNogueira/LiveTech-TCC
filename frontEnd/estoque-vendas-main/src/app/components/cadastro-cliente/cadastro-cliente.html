<div class="cadastro-cliente-container">
    <div class="card-minimalista">
        
        <!-- BOTOES DE NAVEGACAO (ABAS) -->
        <div class="navegacao-abas">
            <button 
                type="button" 
                class="btn-aba" 
                [class.aba-ativa]="abaAtiva === 'cadastrar'" 
                (click)="alternarAba('cadastrar')">
                Novo Cliente
            </button>

            <button 
                type="button" 
                class="btn-aba" 
                [class.aba-ativa]="abaAtiva === 'atualizar'" 
                (click)="alternarAba('atualizar')">
                Gestão de Clientes
            </button>
        </div>

        <!-- ABA DE CADASTRO -->
        @if (abaAtiva === 'cadastrar') {
            <div class="cabecalho-form">
                <h2>Cadastro de Cliente</h2>
                <p>Preencha os dados abaixo para adicionar um novo cliente à base.</p>
            </div>

            <form class="formulario-grid" #form="ngForm" (ngSubmit)="executarCadastroCliente()">
                
                <div class="form-group span-2">
                    <label for="username">Nome:</label>
                    <input 
                        type="text"
                        name="username"
                        id="username"
                        [(ngModel)]="nomeDigitado"
                        placeholder="Primeiro nome do cliente"
                        required>  
                </div>

                <div class="form-group span-2">
                    <label for="sobrenome">Sobrenome:</label>
                    <input 
                        type="text"
                        name="sobrenome"
                        id="sobrenome"
                        [(ngModel)]="sobrenomeDigitado"
                        placeholder="Apelido/Sobrenome completo">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input 
                        type="email"
                        name="email"
                        id="email"
                        [(ngModel)]="emailDigitado"
                        placeholder="cliente@email.com">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input 
                        type="text"
                        name="telefone"
                        [(ngModel)]="telefoneDigitado"
                        placeholder="(00) 00000-0000"
                        mask="(00) 00000-0000">
                </div>

                <div class="acoes-form span-2">
                    <button type="submit" class="btn-primario" [disabled]="form.invalid || carregando">
                        {{carregando ? 'Salvando...' : 'Cadastrar Cliente'}}
                    </button>
                </div>
            </form>
        }
        
        <!-- ABA DE GESTÃO -->
        @if (abaAtiva === 'atualizar') {
            <app-gerenciador-cliente></app-gerenciador-cliente>
        }
    </div>
</div>
