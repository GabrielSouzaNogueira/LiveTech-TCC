<div class="overlay" (click)="fecharPainel()">
  <div class="painel" (click)="$event.stopPropagation()">
    <h3>Finalizar Pedido #{{ pedidoId }}</h3>

    <div class="resumo-valores">
      <div>
        <span>Total do pedido:</span>
        <strong>{{ valorTotal | currency:'BRL' }}</strong>
      </div>
      <div>
        <span>Total pago:</span>
        <strong>{{ totalPago | currency:'BRL' }}</strong>
      </div>
      <div [class.faltante-destaque]="faltante > 0">
        <span>Faltante:</span>
        <strong>{{ faltante | currency:'BRL' }}</strong>
      </div>
    </div>

    <div class="linha-pagamento" *ngFor="let linha of linhasPagamento; let i = index">
      <select [(ngModel)]="linha.formaPagId" name="formaPag{{i}}">
        <option [ngValue]="null" disabled>Forma de pagamento</option>
        <option *ngFor="let forma of formasPagamento" [ngValue]="forma.id">{{ forma.descricao }}</option>
      </select>

      <input type="number" [(ngModel)]="linha.valorPago" name="valor{{i}}" placeholder="Valor" min="0" step="0.01">

      <button type="button" class="btn-remover-linha" (click)="removerLinha(i)" [disabled]="linhasPagamento.length === 1">×</button>
    </div>

    <button type="button" class="btn-adicionar-forma" (click)="adicionarLinha()">+ Adicionar forma de pagamento</button>

    <div class="acoes-painel">
      <button type="button" class="btn-fechar" (click)="fecharPainel()">Cancelar</button>
      <button type="button" class="btn-confirmar" [disabled]="carregando" (click)="confirmarPagamento()">
        {{ carregando ? 'Processando...' : 'Confirmar Pagamento' }}
      </button>
    </div>
  </div>
</div>
